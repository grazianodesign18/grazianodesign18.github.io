<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StandBy AMOLED Clock</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Dynamic Manifest Injection -->
    <script>
        const manifestData = {
            "name": "StandBy Clock",
            "short_name": "StandBy",
            "start_url": "./",
            "display": "standalone",
            "orientation": "landscape",
            "background_color": "#000000",
            "theme_color": "#000000",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3103/3103181.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fallback SHA-256 for cryptographic challenge generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        clock: ['Unbounded', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        amoled: '#000000',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .clock-num {
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -3.5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        #burnin-wrapper {
            transition: transform 1.5s ease-in-out;
        }
    </style>
</head>
<body class="h-full w-full bg-amoled flex items-center justify-center p-4 sm:p-8 select-none">

    <!-- Top Floating Toolbar -->
    <header id="floating-toolbar" class="fixed top-3 right-6 flex items-center gap-3 z-30 opacity-0 transition-opacity duration-500 pointer-events-none">
        <button id="install-pwa-btn" class="hidden text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-full font-bold transition flex items-center gap-1.5 pointer-events-auto">
            <i class="fa-solid fa-download text-[10px]"></i>
            <span>Install App</span>
        </button>
        <button id="fullscreen-btn" class="p-2 text-zinc-400 hover:text-white transition pointer-events-auto" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand text-sm"></i>
        </button>
        <button id="settings-btn" class="p-2 text-zinc-400 hover:text-white transition pointer-events-auto" title="Settings">
            <i class="fa-solid fa-sliders text-sm"></i>
        </button>
    </header>

    <!-- OLED Burn-In Protection Shift Wrapper -->
    <div id="burnin-wrapper" class="w-full max-w-md flex flex-col items-center justify-center my-auto">
        
        <main class="w-full flex flex-col items-center gap-6 text-center">

            <!-- Clock Section -->
            <section class="flex flex-col items-center">
                <div class="flex items-baseline justify-center text-white">
                    <span id="clock-hours" class="clock-num text-6xl sm:text-7xl">12</span>
                    <span class="clock-num text-5xl sm:text-6xl opacity-30 -mt-1 mx-1.5 font-bold">:</span>
                    <span id="clock-minutes" class="clock-num text-6xl sm:text-7xl">00</span>
                    <span id="clock-ampm" class="text-[10px] font-extrabold tracking-widest text-zinc-500 ml-2 uppercase">AM</span>
                </div>
                <p id="clock-date" class="text-xs font-extrabold text-zinc-400 tracking-[0.2em] uppercase mt-3">
                    TUE, OCT 20
                </p>
            </section>

            <!-- Spotify Integration Section -->
            <section class="w-full max-w-sm flex flex-col items-center gap-2 pt-1">
                <div id="spotify-login-view" class="flex flex-col items-center gap-2">
                    <button id="connect-spotify-btn" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-full text-xs font-bold border border-white/10 transition-all transform active:scale-95">
                        <i class="fa-brands fa-spotify text-sm text-white"></i>
                        <span>Connect Spotify Account</span>
                    </button>
                    <p class="text-[9px] text-zinc-500 font-medium px-4 text-center">Hardcoded for GitHub Pages</p>
                </div>

                <div id="spotify-player-view" class="hidden w-full flex flex-col gap-2.5 p-2 rounded-2xl transition-all duration-700 relative overflow-hidden">
                    <div id="ambient-glow" class="absolute inset-0 opacity-25 blur-xl transition-all duration-1000 -z-10 scale-125"></div>

                    <div class="flex items-center justify-between gap-3 relative z-10">
                        <div class="flex items-center gap-3 min-w-0">
                            <img id="album-art" crossorigin="anonymous" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=80" alt="Album Art" class="w-11 h-11 rounded-xl object-cover flex-shrink-0 shadow-xl border border-white/10 transition-transform duration-500">
                            <div class="flex flex-col text-left min-w-0">
                                <h4 id="track-title" class="text-xs font-extrabold text-white truncate leading-tight tracking-wide">Not Playing</h4>
                                <p id="track-artist" class="text-[11px] font-bold text-zinc-400 truncate mt-0.5">Connect Spotify or select active device</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-3 flex-shrink-0">
                            <button id="prev-btn" class="text-zinc-400 hover:text-white transition text-xs">
                                <i class="fa-solid fa-backward-step"></i>
                            </button>
                            <button id="play-btn" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center text-xs font-bold transition transform active:scale-90 shadow-md">
                                <i id="play-icon" class="fa-solid fa-play ml-0.5"></i>
                            </button>
                            <button id="next-btn" class="text-zinc-400 hover:text-white transition text-xs">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 w-full relative z-10 px-0.5">
                        <span id="time-current" class="text-[9px] font-bold text-zinc-500 w-6 text-right">0:00</span>
                        <input id="track-scrubber" type="range" min="0" max="100" value="0" class="w-full">
                        <span id="time-total" class="text-[9px] font-bold text-zinc-500 w-6 text-left">0:00</span>
                    </div>
                </div>
            </section>

            <!-- Status Row -->
            <section class="flex items-center justify-center gap-5 text-zinc-400 text-xs font-extrabold tracking-wide">
                <div class="flex items-center gap-1.5">
                    <i id="weather-icon" class="fa-solid fa-sun text-zinc-400 text-xs"></i>
                    <span id="weather-temp" class="text-zinc-200">22°C</span>
                    <span id="weather-city" class="text-[10px] text-zinc-600 uppercase hidden sm:inline">Lakeshore</span>
                </div>
                <span class="text-zinc-800">•</span>
                <div class="flex items-center gap-1.5">
                    <i id="battery-icon" class="fa-solid fa-battery-three-quarters text-zinc-400 text-xs"></i>
                    <span id="battery-level" class="text-zinc-200">85%</span>
                </div>
                <span class="text-zinc-800">•</span>
                <div class="flex items-center gap-1.5">
                    <i class="fa-regular fa-clock text-zinc-500 text-xs"></i>
                    <span id="alarm-display" class="text-zinc-400">07:00 AM</span>
                </div>
            </section>

        </main>
    </div>

    <!-- SETTINGS DRAWER -->
    <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-zinc-950 border border-zinc-800 rounded-3xl p-6 flex flex-col gap-4 text-xs font-semibold">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 class="font-extrabold text-white text-sm">StandBy Preferences</h3>
                <button id="close-settings-btn" class="text-zinc-400 hover:text-white text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex flex-col gap-3.5">
                <div class="flex items-center justify-between">
                    <span class="text-zinc-300">12-Hour Time Format</span>
                    <input type="checkbox" id="cfg-12h" class="accent-white w-4 h-4 cursor-pointer" checked>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-zinc-300">OLED Burn-In Protection</span>
                    <input type="checkbox" id="cfg-burnin" class="accent-white w-4 h-4 cursor-pointer" checked>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-zinc-300">Temperature Unit</span>
                    <div class="flex gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
                        <button id="unit-c" class="px-2.5 py-0.5 rounded-md bg-zinc-700 text-white font-extrabold">°C</button>
                        <button id="unit-f" class="px-2.5 py-0.5 rounded-md text-zinc-400 font-extrabold">°F</button>
                    </div>
                </div>

                <div class="pt-3 border-t border-zinc-800 flex justify-between items-center">
                    <span id="spotify-account-status" class="text-[10px] text-zinc-500 font-bold">Spotify: Not Connected</span>
                    <button id="logout-spotify-btn" class="hidden text-[10px] text-zinc-400 hover:underline font-bold">Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
        const state = {
            is12h: true,
            tempUnit: 'C',
            tempC: 22,
            burnIn: true,
            spotifyClientId: '33d20f4088af4ba08106bc7082afbd5f', // Hardcoded Client ID
            accessToken: null,
            isPlaying: false,
            trackDuration: 0,
            trackProgress: 0,
            pollInterval: null,
            hideToolbarTimeout: null,
            currentImageSrc: '',
            deferredPrompt: null
        };

        const floatingToolbar = document.getElementById('floating-toolbar');
        const settingsModal = document.getElementById('settings-modal');
        const ambientGlow = document.getElementById('ambient-glow');
        const albumArt = document.getElementById('album-art');
        const clockHours = document.getElementById('clock-hours');
        const clockMinutes = document.getElementById('clock-minutes');
        const clockAmpm = document.getElementById('clock-ampm');
        const clockDate = document.getElementById('clock-date');
        const burninWrapper = document.getElementById('burnin-wrapper');

        const connectSpotifyBtn = document.getElementById('connect-spotify-btn');
        const spotifyLoginView = document.getElementById('spotify-login-view');
        const spotifyPlayerView = document.getElementById('spotify-player-view');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackScrubber = document.getElementById('track-scrubber');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const installPwaBtn = document.getElementById('install-pwa-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const cfg12h = document.getElementById('cfg-12h');
        const cfgBurnin = document.getElementById('cfg-burnin');
        const unitC = document.getElementById('unit-c');
        const unitF = document.getElementById('unit-f');
        const spotifyAccountStatus = document.getElementById('spotify-account-status');
        const logoutSpotifyBtn = document.getElementById('logout-spotify-btn');

        // Hardcoded Redirect URI for GitHub Pages
        const REDIRECT_URI = 'https://grazianodesign18.github.io/';

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            
            if (state.is12h) {
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                clockAmpm.textContent = ampm;
                clockAmpm.style.display = 'inline';
            } else {
                clockAmpm.style.display = 'none';
                h = String(h).padStart(2, '0');
            }

            clockHours.textContent = h;
            clockMinutes.textContent = m;

            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            clockDate.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function applyBurnInShift() {
            if (!state.burnIn) return;
            const x = (Math.random() - 0.5) * 16;
            const y = (Math.random() - 0.5) * 16;
            burninWrapper.style.transform = `translate(${x}px, ${y}px)`;
        }
        setInterval(applyBurnInShift, 60000);

        function showToolbar() {
            floatingToolbar.classList.remove('opacity-0', 'pointer-events-none');
            floatingToolbar.classList.add('opacity-100', 'pointer-events-auto');

            clearTimeout(state.hideToolbarTimeout);
            state.hideToolbarTimeout = setTimeout(() => {
                if (settingsModal.classList.contains('hidden')) {
                    floatingToolbar.classList.remove('opacity-100', 'pointer-events-auto');
                    floatingToolbar.classList.add('opacity-0', 'pointer-events-none');
                }
            }, 2000);
        }

        window.addEventListener('touchstart', showToolbar, { passive: true });
        window.addEventListener('mousemove', showToolbar, { passive: true });
        window.addEventListener('click', showToolbar, { passive: true });

        function updateAmbientColor(imgSrc) {
            if (state.currentImageSrc === imgSrc) return;
            state.currentImageSrc = imgSrc;

            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgSrc;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1;
                canvas.height = 1;
                ctx.drawImage(img, 0, 0, 1, 1);
                const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                ambientGlow.style.background = `radial-gradient(circle, rgba(${r},${g},${b},0.85) 0%, rgba(0,0,0,0) 75%)`;
            };
        }

        async function initBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    const updateBattery = () => {
                        const lvl = Math.round(battery.level * 100);
                        document.getElementById('battery-level').textContent = `${lvl}%`;
                        const batIcon = document.getElementById('battery-icon');
                        if (battery.charging) {
                            batIcon.className = 'fa-solid fa-bolt text-zinc-200 text-xs';
                        } else {
                            batIcon.className = 'fa-solid fa-battery-three-quarters text-zinc-400 text-xs';
                        }
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                } catch(e) {}
            }
        }
        initBattery();

        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing streaming user-read-email user-read-private';

        function generateRandomString(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            
            let digest;
            if (window.crypto && window.crypto.subtle) {
                digest = await window.crypto.subtle.digest('SHA-256', data);
                return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } else {
                const hashBytes = sha256.array(codeVerifier);
                return btoa(String.fromCharCode.apply(null, hashBytes))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
        }

        async function redirectToSpotifyAuth() {
            const verifier = generateRandomString(128);
            localStorage.setItem('spotify_code_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);

            const args = new URLSearchParams({
                response_type: 'code',
                client_id: state.spotifyClientId,
                scope: SCOPES,
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: challenge
            });

            window.location.href = `https://accounts.spotify.com/authorize?${args.toString()}`;
        }

        async function handleSpotifyCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (!code) return;

            const verifier = localStorage.getItem('spotify_code_verifier');

            const body = new URLSearchParams({
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI,
                client_id: state.spotifyClientId,
                code_verifier: verifier
            });

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });
                const data = await response.json();
                if (data.access_token) {
                    state.accessToken = data.access_token;
                    localStorage.setItem('spotify_access_token', data.access_token);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    initSpotifyPlayer();
                } else {
                    console.error("Token Exchange Failed:", data);
                    alert("Spotify authorization failed. Check your Client ID and Redirect URI settings.");
                }
            } catch (e) {
                console.error("Spotify Auth Error:", e);
            }
        }

        async function fetchCurrentPlayback() {
            if (!state.accessToken) return;
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });
                if (res.status === 204 || res.status > 400) return;
                const data = await res.json();
                if (data && data.item) {
                    trackTitle.textContent = data.item.name;
                    trackArtist.textContent = data.item.artists.map(a => a.name).join(', ');
                    const newArt = data.item.album.images[0]?.url || albumArt.src;
                    albumArt.src = newArt;
                    updateAmbientColor(newArt);

                    state.isPlaying = data.is_playing;
                    playIcon.className = state.isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play ml-0.5';
                    state.trackDuration = Math.floor(data.item.duration_ms / 1000);
                    state.trackProgress = Math.floor(data.progress_ms / 1000);
                    updateScrubber();
                }
            } catch (e) {}
        }

        function updateScrubber() {
            if (!state.trackDuration) return;
            trackScrubber.value = (state.trackProgress / state.trackDuration) * 100;
            timeCurrent.textContent = formatTime(state.trackProgress);
            timeTotal.textContent = formatTime(state.trackDuration);
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        async function spotifyControl(action, method = 'POST') {
            if (!state.accessToken) return;
            try {
                await fetch(`https://api.spotify.com/v1/me/player/${action}`, {
                    method: method,
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });
                setTimeout(fetchCurrentPlayback, 300);
            } catch (e) {}
        }

        function initSpotifyPlayer() {
            const savedToken = localStorage.getItem('spotify_access_token');
            if (savedToken) state.accessToken = savedToken;

            if (state.accessToken) {
                spotifyLoginView.classList.add('hidden');
                spotifyPlayerView.classList.remove('hidden');
                spotifyAccountStatus.textContent = "Spotify: Connected";
                logoutSpotifyBtn.classList.remove('hidden');
                
                fetchCurrentPlayback();
                state.pollInterval = setInterval(fetchCurrentPlayback, 3000);
            }
        }

        connectSpotifyBtn.addEventListener('click', redirectToSpotifyAuth);
        
        playBtn.addEventListener('click', () => {
            if (state.isPlaying) {
                spotifyControl('pause', 'PUT');
            } else {
                spotifyControl('play', 'PUT');
            }
        });
        nextBtn.addEventListener('click', () => spotifyControl('next'));
        prevBtn.addEventListener('click', () => spotifyControl('previous'));

        logoutSpotifyBtn.addEventListener('click', () => {
            localStorage.removeItem('spotify_access_token');
            state.accessToken = null;
            spotifyLoginView.classList.remove('hidden');
            spotifyPlayerView.classList.add('hidden');
            logoutSpotifyBtn.classList.add('hidden');
            spotifyAccountStatus.textContent = "Spotify: Not Connected";
            if (state.pollInterval) clearInterval(state.pollInterval);
        });

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            state.deferredPrompt = e;
            installPwaBtn.classList.remove('hidden');
        });

        installPwaBtn.addEventListener('click', async () => {
            if (state.deferredPrompt) {
                state.deferredPrompt.prompt();
                const { outcome } = await state.deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installPwaBtn.classList.add('hidden');
                }
                state.deferredPrompt = null;
            }
        });

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

        cfg12h.addEventListener('change', (e) => {
            state.is12h = e.target.checked;
            updateClock();
        });

        cfgBurnin.addEventListener('change', (e) => {
            state.burnIn = e.target.checked;
            if (!state.burnIn) burninWrapper.style.transform = 'translate(0px, 0px)';
        });

        unitC.addEventListener('click', () => {
            state.tempUnit = 'C';
            unitC.className = 'px-2.5 py-0.5 rounded-md bg-zinc-700 text-white font-extrabold';
            unitF.className = 'px-2.5 py-0.5 rounded-md text-zinc-400 font-extrabold';
            document.getElementById('weather-temp').textContent = `${state.tempC}°C`;
        });

        unitF.addEventListener('click', () => {
            state.tempUnit = 'F';
            unitF.className = 'px-2.5 py-0.5 rounded-md bg-zinc-700 text-white font-extrabold';
            unitC.className = 'px-2.5 py-0.5 rounded-md text-zinc-400 font-extrabold';
            const tempF = Math.round((state.tempC * 9/5) + 32);
            document.getElementById('weather-temp').textContent = `${tempF}°F`;
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        handleSpotifyCallback();
        initSpotifyPlayer();
    </script>
</body>
</html>
